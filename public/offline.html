<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>You're Offline</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f8fafc;
            color: #0f172a;
            text-align: center;
        }

        .offline {
            max-width: 420px;
        }

        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 28px;
        }

        p {
            margin: 0 0 24px;
            color: #64748b;
            line-height: 1.6;
        }

        button {
            border: 0;
            padding: 12px 20px;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <main class="offline">
        <div class="icon">📡</div>

        <h1>You're offline</h1>

        <p>
            It looks like you've lost your internet connection.
            Please reconnect and try again.
        </p>

        <button onclick="location.reload()">
            Try again
        </button>
    </main>
</body>
</html>
